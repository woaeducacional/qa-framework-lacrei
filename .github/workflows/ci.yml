name: QA Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-assurance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes Cypress
        run: npm run cypress:run

      - name: Publicar evidências da automação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-automation-evidence
          path: |
            cypress/screenshots/**
            cypress/videos/**
          if-no-files-found: warn
          retention-days: 14
